<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomson | HXTE</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: url('assets/banner.gif') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: white;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,0.45);
      z-index: 0;
    }

    /* 🌑 Интро */
    .intro {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 20px;
      letter-spacing: 1px;
      z-index: 100;
      transition: opacity 1.8s ease;
    }
    .intro.hide {
      opacity: 0;
      pointer-events: none;
    }
    .intro-text {
      opacity: 0.8;
      font-size: 22px;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 💠 Карточка */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      transition: transform 0.6s ease, background 0.4s ease, box-shadow 0.6s ease;
      opacity: 0;
      transform: scale(0.9);
      overflow: hidden;
    }
    .card.show {
      animation: cardIn 1.5s ease forwards;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: scale(1); }
    }
    .card:hover {
      transform: scale(1.06);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 40px rgba(255,255,255,0.15);
    }

    /* 🖼️ Аватарка и Discord-статус */
    .avatar-wrapper {
      position: relative;
      display: inline-block;
    }
    .pfp {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #fff;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
    }
    .card:hover .pfp {
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
    }

    .status-icon {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #18191c;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      transition: transform 0.1s ease-out;
    }

    .name {
      font-size: 28px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      margin-top: 10px;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .links {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.3s ease;
    }
    .btn img {
      width: 20px;
      height: 20px;
      transition: 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }
    .btn:hover img {
      transform: scale(1.2);
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
    }

    /* 👁 Просмотры */
    .views {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.8;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
      user-select: none;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <!-- 🎬 Интро -->
  <div class="intro" id="intro">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: 2px;">H X T E</div>
    <div class="intro-text">Нажмите, чтобы войти</div>
  </div>

  <!-- 💾 Основная карточка -->
  <div class="card" id="card">
    <div class="avatar-wrapper">
      <img src="assets/icon.png" class="pfp" id="pfp">
      <div id="discord-status-icon" class="status-icon"></div>
    </div>
    <div class="name">Thomson</div>
    <div class="status">H X T E</div>
    <div class="links" id="links"></div>
    <div class="views" id="views">👁 Просмотров: 0</div>
  </div>

  <!-- 🎧 Музыка -->
  <audio id="bg-music" loop>
    <source src="assets/thomson_music.mp3" type="audio/mp3">
  </audio>

  <script>
    const intro = document.getElementById("intro");
    const card = document.getElementById("card");
    const music = document.getElementById("bg-music");
    const statusIcon = document.getElementById("discord-status-icon");
    const viewsElement = document.getElementById("views");

    // === Кнопки ===
    const links = [
      { icon: "https://images.icon-icons.com/3206/PNG/512/discord_icon_195948.png", text: "Discord", url: "https://discord.gg/Kk7t4cjtFZ" },
      { icon: "https://images.icon-icons.com/2148/PNG/512/telegram_icon_131945.png", text: "Telegram", url: "https://t.me/thomson_hxte" },
      { icon: "https://images.icon-icons.com/2248/PNG/512/twitch_icon_137066.png", text: "Twitch", url: "https://www.twitch.tv/hate_famq" },
      { icon: "https://images.icon-icons.com/791/PNG/512/YOUTUBE_icon-icons.com_65487.png", text: "YouTube", url: "https://www.youtube.com/@hate_famq" },
    ];
    const linksContainer = document.getElementById("links");
    links.forEach(link => {
      const a = document.createElement("a");
      a.href = link.url;
      a.className = "btn";
      a.target = "_blank";
      a.innerHTML = `<img src="${link.icon}" alt=""> ${link.text}`;
      linksContainer.appendChild(a);
    });

    // === Discord статус ===
    async function updateStatus() {
      try {
        const res = await fetch("https://api.lanyard.rest/v1/users/1223426765045633255");
        const data = await res.json();
        const colors = {
          online: "#3ba55d",
          idle: "#faa61a",
          dnd: "#ed4245",
          offline: "#747f8d"
        };
        statusIcon.style.background = colors[data?.data?.discord_status] || "#747f8d";
      } catch {
        statusIcon.style.background = "#747f8d";
      }
    }
    updateStatus();
    setInterval(updateStatus, 15000);

    // === Переход с интро ===
    intro.addEventListener("click", () => {
      intro.classList.add("hide");
      card.classList.add("show");
      setTimeout(() => intro.remove(), 2000);
      music.volume = 0.1;
      music.play().catch(() => {});
      animateTitle();
      updateViews();
    });

    // === Просмотры профиля ===
    function updateViews() {
      const views = parseInt(localStorage.getItem("thomson_views") || "0") + 1;
      localStorage.setItem("thomson_views", views);
      viewsElement.textContent = `👁 Просмотров: ${views}`;
    }

    // === 🔠 Анимация title ===
    function animateTitle() {
      const full = "@THOMSON";
      let i = 0;
      let deleting = false;

      function loop() {
        document.title = full.substring(0, i);
        if (!deleting && i < full.length) i++;
        else if (deleting && i > 1) i--;
        else {
          deleting = !deleting;
          setTimeout(loop, 1500);
          return;
        }
        setTimeout(loop, 300);
      }
      loop();
    }
  </script>
</body>
</html>
